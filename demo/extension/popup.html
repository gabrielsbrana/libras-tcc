<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Glosa Libras</title>
<style>
  body { width: 460px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, "Segoe UI", Arial, sans-serif; color: #1c2430; background: #f5f7fa; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  #servidor { color: #5d6878; font-size: 12px; margin-bottom: 10px; }
  .linha { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  select, input[type=text] { padding: 7px; border: 1px solid #d7dce3; border-radius: 7px; font: inherit; }
  input[type=text] { flex: 1; }
  button { padding: 8px 12px; border: 0; border-radius: 7px; background: #2a6fb0; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.sec { background: #5d6878; }
  button:disabled { opacity: .55; cursor: default; }
  #capturar { flex: 1; }
  #status { min-height: 18px; color: #5d6878; margin: 6px 0 8px; }
  #saida { max-height: 380px; overflow-y: auto; }
  .item { background: #fff; border: 1px solid #d7dce3; border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; }
  .pt { font-weight: 600; margin-bottom: 5px; }
  .rot { color: #5d6878; font-size: 11px; margin-top: 5px; }
  .glosa { font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
  .na { color: #a23b3b; font-style: italic; font-family: inherit; }
</style>
</head>
<body>
  <h1>Português → glosa em Libras</h1>
  <div id="servidor">Verificando o servidor local…</div>
  <div class="linha">
    <select id="duracao" aria-label="Duração da captura">
      <option value="10">10 s</option>
      <option value="15" selected>15 s</option>
      <option value="30">30 s</option>
    </select>
    <button id="capturar">Capturar áudio da aba e traduzir</button>
  </div>
  <div class="linha">
    <input type="text" id="texto" placeholder="Ou digite uma frase em português" aria-label="Frase em português">
    <button id="traduzir" class="sec">Traduzir</button>
  </div>
  <div id="status"></div>
  <div id="saida"></div>
  <script src="popup.js"></script>
</body>
</html>
